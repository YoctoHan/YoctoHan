le-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#E8F1F8" text-anchor="middle">TensorRT-LLM</text><text x="24" y="155" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8FB0C9" letter-spacing="1.5">TOOLING</text><rect x="190" y="142" width="55" height="18" fill="#132846" rx="4" stroke="#8FDCF2" stroke-width="1"/><text x="217.5" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#E8F1F8" text-anchor="middle">Docker</text><rect x="253" y="142" width="48" height="18" fill="#132846" rx="4" stroke="#8FDCF2" stroke-width="1"/><text x="277" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#E8F1F8" text-anchor="middle">LaTeX</text><path d="M192,181 L192,192 L203,192" fill="none" stroke="#F5B86A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M198.6,194.4 L203,192 L198.6,189.6" fill="none" stroke="#F5B86A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="211" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" fill="#F5B86A" font-style="italic">the ideas get written in LaTeX; the speed gets written in CUDA.</text></svg>
